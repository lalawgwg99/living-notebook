<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小樣 C — 禪風留白</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fbfbfa; color: #3a3a38; font-family: -apple-system, "Noto Sans TC", "PingFang TC", sans-serif; font-size: 15px; font-weight: 300; }
  .topbar { display: flex; align-items: baseline; justify-content: space-between; padding: 26px 26px 18px; }
  .brand { font-size: 14px; letter-spacing: 8px; font-weight: 400; }
  .add { border: none; background: none; font-size: 13px; letter-spacing: 2px; color: #3a3a38; cursor: pointer; }
  .add::before { content: "+ "; }
  .chips { display: flex; gap: 26px; padding: 6px 26px 18px; overflow-x: auto; border-bottom: 1px solid #eee; }
  .chip { border: none; background: none; font-size: 12.5px; letter-spacing: 2px; color: #a8a8a2; cursor: pointer; white-space: nowrap; font-weight: 300; padding: 2px 0; }
  .chip i { font-style: normal; font-size: 10px; margin-left: 5px; color: #c9c9c2; }
  .chip.active { color: #3a3a38; font-weight: 500; }
  .chip.active::before { content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: #c8402a; margin-right: 7px; vertical-align: 2px; }
  .main { padding: 8px 26px 80px; max-width: 480px; margin: 0 auto; }
  .notice { padding: 22px 0; border-bottom: 1px solid #eee; font-size: 13px; color: #8a8a84; letter-spacing: 1px; display: flex; justify-content: space-between; }
  .notice b { color: #c8402a; font-weight: 500; }
  .item { padding: 30px 0; border-bottom: 1px solid #eee; }
  .kicker { font-size: 10.5px; letter-spacing: 3px; color: #b5b5ad; margin-bottom: 10px; }
  .kicker.urgent { color: #c8402a; }
  .item h3 { font-size: 19px; font-weight: 500; letter-spacing: 1px; line-height: 1.6; }
  .dates { font-size: 12px; color: #a8a8a2; margin-top: 8px; letter-spacing: 1.5px; font-variant-numeric: tabular-nums; }
  .remain { font-size: 13px; margin-top: 10px; letter-spacing: 1px; color: #8a8a84; }
  .remain b { font-weight: 500; color: #3a3a38; font-size: 15px; }
  .remain.urgent { color: #c8402a; }
  .remain.urgent b { color: #c8402a; }
  .line { height: 1px; background: #e4e4e0; margin: 18px 0 0; position: relative; }
  .line i { display: block; height: 100%; background: #3a3a38; }
  .line.urgent i { background: #c8402a; }
  .line .now { position: absolute; top: 50%; width: 5px; height: 5px; border-radius: 50%; background: #c8402a; transform: translate(-50%, -50%); }
  .summary { font-size: 13.5px; color: #77776f; margin-top: 16px; line-height: 2; font-weight: 300; }
  .meta { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
  .pts { font-size: 12px; color: #a8a8a2; letter-spacing: 1px; }
  .pts span { margin-right: 14px; }
  .ics { border: none; background: none; font-size: 12px; letter-spacing: 2px; color: #3a3a38; cursor: pointer; border-bottom: 1px solid #3a3a38; padding-bottom: 2px; }
  .sec { font-size: 10.5px; letter-spacing: 5px; color: #c9c9c2; margin: 34px 0 0; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">活筆記</div>
    <button class="add">新增</button>
  </div>
  <div class="chips">
    <button class="chip">全部<i>4</i></button>
    <button class="chip active">進行中<i>2</i></button>
    <button class="chip">即將到期<i>1</i></button>
    <button class="chip">未開始<i>1</i></button>
    <button class="chip">已結束<i>1</i></button>
  </div>
  <div class="main">
    <div class="notice"><span>有一則活動即將到期</span><b>剩 3 天</b></div>

    <div class="sec">即將到期</div>
    <div class="item">
      <div class="kicker urgent">家電 · 雙十檔期</div>
      <h3>雙十特賣快閃</h3>
      <div class="dates">10.09 — 10.12</div>
      <div class="remain urgent">剩 <b>3</b> 天</div>
      <div class="line urgent"><i style="width:75%"></i><span class="now" style="left:75%"></span></div>
      <p class="summary">雙十連假家電特賣，電視全面九折，滿千送百只到本週日。</p>
      <div class="meta"><div class="pts"><span>電視全面九折</span><span>滿千送百</span></div><button class="ics">行事曆</button></div>
    </div>

    <div class="sec">進行中</div>
    <div class="item">
      <div class="kicker">惠而浦 · 週年慶</div>
      <h3>惠而浦雙門冰箱特賣</h3>
      <div class="dates">10.01 — 10.31</div>
      <div class="remain">剩 <b>22</b> 天</div>
      <div class="line"><i style="width:28%"></i><span class="now" style="left:28%;background:#3a3a38"></span></div>
      <p class="summary">指定冰箱、微波爐組合優惠，滿額再送商品券。</p>
      <div class="meta"><div class="pts"><span>滿3000送300</span><span>兌換至11/7</span></div><button class="ics">行事曆</button></div>
    </div>

    <div class="item">
      <div class="kicker">萬家福 · 已結束</div>
      <h3>中秋家電展</h3>
      <div class="dates">09.20 — 09.28</div>
      <div class="remain">已結束</div>
      <div class="line"><i style="width:100%;background:#d8d8d2"></i></div>
      <p class="summary">中秋檔期全館滿萬折千，贈品已兌換完畢。</p>
    </div>
  </div>
</body>
</html>
