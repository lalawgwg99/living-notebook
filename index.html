<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>活筆記 — 會自己長大的筆記本</title>
<meta name="description" content="把看到的影片和文章丟進來，筆記本自動分類、長出多個大腦，自己分裂、進化。想看重點時，問它就好。">
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-orb" id="brandOrb" aria-hidden="true"></span>
      <span class="brand-name">活筆記</span>
    </div>
    <div class="topbar-actions">
      <input id="searchInput" class="search" type="search" placeholder="搜尋筆記、重點、標籤…" autocomplete="off">
      <button id="addBtn" class="btn-primary">＋ 丟進來</button>
    </div>
  </header>

  <main class="layout">
    <!-- 左：主人格＋大腦們 -->
    <aside class="side">
      <div class="persona-mini" id="personaCard">
        <div class="persona-mini-orb" id="personaOrb"><span id="personaEmoji">📓</span></div>
        <div class="persona-mini-info">
          <div class="persona-mini-name" id="personaName">一本空白的筆記本</div>
          <div class="persona-mini-mood" id="personaMood">還沒醒來</div>
        </div>
      </div>
      <p class="persona-mini-greeting" id="personaGreeting">嗨，我還沒有名字。丟一些你看到的影片或文章給我，我會自動分類、長出大腦。</p>

      <div class="brains-head">
        <span>🧠 大腦們</span>
        <span class="brains-count" id="brainsCount"></span>
      </div>
      <div class="brains-view-toggle" role="tablist" aria-label="大腦顯示方式">
        <button class="view-btn active" id="viewListBtn">📋 清單</button>
        <button class="view-btn" id="viewSkyBtn">✨ 星系</button>
      </div>
      <nav class="brain-list" id="brainList"></nav>
      <div class="constellation-wrap hidden" id="constellationWrap">
        <canvas id="brainCanvas"></canvas>
        <p class="constellation-hint">點一顆星球，進入那個大腦的世界</p>
      </div>

      <p class="auto-hint">✨ 主人格會自己默默長大</p>
      <div class="side-stats">
        <span><b id="statNotes">0</b> 則收藏</span>
        <span><b id="statPoints">0</b> 個重點</span>
      </div>
    </aside>

    <!-- 右：腦內世界 -->
    <section class="notes-col">
      <div class="brain-detail hidden" id="brainDetail"></div>
      <div class="notes-grid" id="notesGrid"></div>
      <div class="empty-state" id="emptyState">
        <div class="sleep-brain" aria-hidden="true">
          <svg viewBox="0 0 140 140">
            <defs>
              <radialGradient id="sbg" cx="50%" cy="42%" r="62%">
                <stop offset="0%" stop-color="#b9a7e8" stop-opacity="0.85"/>
                <stop offset="100%" stop-color="#b9a7e8" stop-opacity="0"/>
              </radialGradient>
            </defs>
            <circle cx="70" cy="66" r="52" fill="url(#sbg)"/>
            <path d="M70 28c-22 0-38 16-38 37 0 7 2 14 6 19-1 3-1 5 0 7 4 12 15 21 32 21s28-9 32-21c1-2 1-4 0-7 4-5 6-12 6-19 0-21-16-37-38-37z"
              fill="#a894e0" opacity="0.9"/>
            <path d="M70 28c-22 0-38 16-38 37 0 7 2 14 6 19-1 3-1 5 0 7 4 12 15 21 32 21s28-9 32-21c1-2 1-4 0-7 4-5 6-12 6-19 0-21-16-37-38-37z"
              fill="none" stroke="#7d6cc4" stroke-width="2" opacity="0.5"/>
            <path d="M48 68q8 7 16 0M76 68q8 7 16 0" stroke="#3d3752" stroke-width="3.5"
              fill="none" stroke-linecap="round"/>
            <text class="zb z1" x="104" y="36" font-size="15" fill="#8f8578">z</text>
            <text class="zb z2" x="116" y="26" font-size="12" fill="#8f8578">z</text>
            <text class="zb z3" x="126" y="18" font-size="9" fill="#8f8578">z</text>
          </svg>
        </div>
        <h2 class="sleeping">我還在沉睡…</h2>
        <p>餵我吃點東西吧——丟進影片或文章，<br>我會自動分類、摘要重點，長出專屬大腦。</p>
        <button class="btn-primary" id="emptyAddBtn">餵第一口進來</button>
      </div>
    </section>
  </main>

  <button id="chatFab" class="chat-fab" aria-label="問筆記本">💬</button>
  <div class="chat-panel hidden" id="chatPanel">
    <div class="chat-head">
      <span class="chat-title">問<span id="chatPersonaName">筆記本</span></span>
      <button class="chat-close" id="chatClose">✕</button>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input-row">
      <input id="chatInput" type="text" placeholder="例如：投資腦裡有什麼重點？" autocomplete="off">
      <button id="chatSend" class="btn-primary">送出</button>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal">
      <div class="modal-tabs">
        <button class="modal-tab active" data-tab="link">🔗 貼連結</button>
        <button class="modal-tab" data-tab="text">✏️ 寫文字</button>
      </div>
      <div class="modal-pane" id="paneLink">
        <div class="feed-pod-head">🍼 投餵艙</div>
        <input id="linkUrl" class="feed-pod" type="url" placeholder="餵入 YouTube 影片、Medium 文章或 X 貼文…" autocomplete="off">
        <p class="modal-note">丟進來之後全自動：抓內容 → 摘要重點 → 分類進大腦 → 大腦自己進化。</p>
      </div>
      <div class="modal-pane hidden" id="paneText">
        <input id="textTitle" type="text" placeholder="標題（可不填）" autocomplete="off">
        <textarea id="textBody" rows="5" placeholder="把想記的東西寫下來…"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" id="modalCancel">取消</button>
        <button class="btn-primary" id="modalSave">丟進筆記本</button>
      </div>
      <div class="modal-loading hidden" id="modalLoading"><span class="spinner"></span><span id="modalLoadingText">正在抓取內容…</span></div>
      <div class="modal-pipeline hidden" id="modalPipeline"></div>
    </div>
  </div>

  <!-- 手動補充對話框 -->
  <div class="modal-backdrop hidden" id="suppBackdrop">
    <div class="modal">
      <h3 class="supp-title">✏️ 幫它補充內容</h3>
      <p class="modal-note" id="suppDesc">這支影片穿了隱形衣，我抓不到內容。把你記得的、或影片下方的簡介貼上來，我來整理成重點。</p>
      <div class="modal-pane">
        <textarea id="suppText" rows="6" placeholder="貼上影片簡介、字幕，或你記得的內容…"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" id="suppCancel">取消</button>
        <button class="btn-primary" id="suppSave">讓 AI 整理</button>
      </div>
      <div class="modal-loading hidden" id="suppLoading"><span class="spinner"></span><span>AI 整理中…</span></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>
  <div id="absorbFx" aria-hidden="true">
    <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div class="gulp">😋</div>
  </div>

  <footer class="foot">
    <span>活筆記 · 你的第二個大腦</span>
    <span class="foot-links"><button id="exportBtn" class="link-btn">匯出</button> · <button id="importBtn" class="link-btn">匯入</button></span>
    <input type="file" id="importFile" accept="application/json" class="hidden">
  </footer>
</div>
<script src="app.js"></script>
</body>
</html>
