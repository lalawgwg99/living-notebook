<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>期印 — 檔期管理</title>
<meta name="description" content="DM、型錄、活動訊息丟進來，自動整理成檔期，標出截止日並提醒。">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261009h">
<script src="config.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="seal" id="activityDot" aria-hidden="true">印</span><span class="brand-name">期印<small>檔期管理</small></span></div>
    <input id="searchInput" class="search" type="search" placeholder="搜尋活動、品牌…" autocomplete="off">
    <div class="topbar-actions">
      <button id="assistantBtn" class="icon-btn" aria-label="AI 助手">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H5l-2 2V12a8 8 0 0 1 8-8h2a8 8 0 0 1 8 8z"/></svg>
      </button>
      <button id="addBtn" class="btn-outline">＋ 新增</button>
    </div>
  </header>

  <div class="phase-bar"><div class="phase-chips" id="phaseChips"></div></div>

  <main class="main">
    <div class="expiry-banner hidden" id="expiryBanner"></div>
    <div class="cards" id="notesGrid"></div>
    <div class="empty-state" id="emptyState">
      <div class="empty-mark" aria-hidden="true">
        <svg viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round">
          <rect x="16" y="22" width="64" height="58" rx="9"/>
          <line x1="16" y1="38" x2="80" y2="38"/>
          <line x1="34" y1="12" x2="34" y2="26"/>
          <line x1="62" y1="12" x2="62" y2="26"/>
          <circle cx="48" cy="58" r="11"/>
          <line x1="48" y1="58" x2="48" y2="51"/>
          <line x1="48" y1="58" x2="53" y2="60"/>
        </svg>
      </div>
      <h2>尚無活動</h2>
      <p>新增第一筆 DM，自動辨識檔期與截止日。</p>
      <button class="btn-primary" id="emptyAddBtn">新增</button>
    </div>
  </main>

  <aside class="assistant-panel hidden" id="assistantPanel" aria-label="AI 助手">
    <div class="assistant-head">
      <span>AI 助手</span>
      <button class="icon-btn" id="assistantClose" aria-label="關閉">✕</button>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-input-row">
      <input id="chatInput" type="text" placeholder="例如：這週有哪些活動到期？" autocomplete="off">
      <button id="chatSend" class="btn-primary">送出</button>
    </div>
  </aside>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal">
      <div class="modal-title">新增活動</div>
      <div class="modal-tabs">
        <button class="modal-tab active" data-tab="link">連結</button>
        <button class="modal-tab" data-tab="text">文字</button>
        <button class="modal-tab" data-tab="image">圖片</button>
        <button class="modal-tab" data-tab="pdf">PDF</button>
      </div>
      <div class="modal-pane" id="paneLink">
        <input id="linkUrl" class="feed-pod" type="url" placeholder="貼上影片或文章連結…" autocomplete="off">
        <p class="modal-note">全自動處理：抓取內容 → 摘要重點 → 自動分類歸檔。</p>
      </div>
      <div class="modal-pane hidden" id="paneText">
        <input id="textTitle" type="text" placeholder="標題（可不填）" autocomplete="off">
        <textarea id="textBody" rows="5" placeholder="貼上活動訊息、LINE 轉傳內容…"></textarea>
      </div>
      <div class="modal-pane hidden" id="paneImage">
        <div class="dropzone" id="imgDrop" role="button" tabindex="0" aria-label="選擇圖片">
          <div class="dropzone-text">選擇圖片 / 拖入此處（可多選）<br><span>或直接 Ctrl+V 貼上截圖</span></div>
        </div>
        <input type="file" id="imgFile" accept="image/*" multiple class="hidden">
        <div id="imgPreviewList" class="img-preview-list"></div>
        <input id="imgHint" type="text" placeholder="補充說明（選填，例如：萬家福DM）" autocomplete="off">
        <p class="modal-note">自動辨識圖片中的活動名稱、日期與優惠規則。</p>
      </div>
      <div class="modal-pane hidden" id="panePdf">
        <div class="dropzone" id="pdfDrop" role="button" tabindex="0" aria-label="選擇PDF">
          <div class="dropzone-text">點此選擇 / 拖入 PDF 型錄<br><span>自動抽出文字整理成重點</span></div>
        </div>
        <input type="file" id="pdfFile" accept="application/pdf" class="hidden">
        <p class="modal-note" id="pdfName"></p>
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" id="modalCancel">取消</button>
        <button class="btn-primary" id="modalSave">新增</button>
      </div>
      <div class="modal-loading hidden" id="modalLoading"><span class="spinner"></span><span id="modalLoadingText">正在抓取內容…</span></div>
      <div class="modal-pipeline hidden" id="modalPipeline"></div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="suppBackdrop">
    <div class="modal">
      <h3 class="supp-title">補充內容</h3>
      <p class="modal-note" id="suppDesc">抓不到這個連結的內容。把你記得的內容貼上來，我來整理。</p>
      <div class="modal-pane">
        <textarea id="suppText" rows="6" placeholder="貼上簡介、字幕，或你記得的內容…"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn-ghost" id="suppCancel">取消</button>
        <button class="btn-primary" id="suppSave">讓 AI 整理</button>
      </div>
      <div class="modal-loading hidden" id="suppLoading"><span class="spinner"></span><span>AI 整理中…</span></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>
  <div id="absorbFx" aria-hidden="true">
    <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
  </div>

  <footer class="foot">
    <span>期印 · 檔期管理</span>
    <span class="foot-links"><button id="exportBtn" class="link-btn">匯出</button> · <button id="importBtn" class="link-btn">匯入</button></span>
    <input type="file" id="importFile" accept="application/json" class="hidden">
  </footer>
</div>
<script src="app.js?v=20261009h"></script>
</body>
</html>
